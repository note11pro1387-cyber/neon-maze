// -----------------------------------------------------------------------------
// NEON MAZE — :app module build script
// -----------------------------------------------------------------------------
// Android application module (UI, lifecycle, Canvas rendering, input, SQLite).
// Game logic lives in :core as a plain Java dependency.
//
// Toolchain: AGP 9.4.0, Gradle 9.6.0, JDK 17.
// compileSdk 37 (required by androidx.core 1.19.x AAR metadata),
// targetSdk 36, minSdk 24.
//
// Vazirmatn fonts are NOT handled here any more. They are prepared before
// Gradle runs by tools/ci/fetch-vazirmatn-fonts.sh into
// app/src/main/assets/fonts/ (ordinary static assets).
// -----------------------------------------------------------------------------

plugins {
    id 'com.android.application'
}

// The content endpoint is public data, never a credential. Empty by default:
// the APK is fully playable offline unless a pack endpoint is configured.
def configuredContentManifestUrl = ((findProperty('neonMazeContentManifestUrl')
        ?: System.getenv('NEON_MAZE_CONTENT_MANIFEST_URL') ?: '') as String).trim()
if (!configuredContentManifestUrl.isEmpty()) {
    if (configuredContentManifestUrl.length() > 2048
            || (configuredContentManifestUrl =~ /[\p{Cntrl}\s]/).find()) {
        throw new GradleException('Invalid NEON MAZE content manifest URL: invalid characters')
    }
    URI parsedContentUrl
    try {
        parsedContentUrl = new URI(configuredContentManifestUrl)
    } catch (URISyntaxException invalidUrl) {
        throw new GradleException('Invalid NEON MAZE content manifest URL: ' + invalidUrl.message)
    }
    if (!'https'.equalsIgnoreCase(parsedContentUrl.scheme)
            || parsedContentUrl.host == null || parsedContentUrl.host.isEmpty()
            || parsedContentUrl.userInfo != null || parsedContentUrl.fragment != null) {
        throw new GradleException('Invalid NEON MAZE content manifest URL: must be HTTPS without user information or fragments')
    }
}
String escapedContentManifestUrl = configuredContentManifestUrl
        .replace('\\', '\\\\').replace('"', '\\"')
String contentManifestBuildConfigValue = '"' + escapedContentManifestUrl + '"'

android {
    namespace = 'com.neonmaze.app'

    compileSdk = 37

    defaultConfig {
        applicationId = 'com.neonmaze.app'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0.0'
        buildConfigField 'String', 'CONTENT_MANIFEST_URL', contentManifestBuildConfigValue
    }

    buildTypes {
        debug {
            // Not minified so stack traces remain readable.
            minifyEnabled = false
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // BuildConfig carries only the optional public content-manifest URL.
    buildFeatures {
        buildConfig = true
    }

    // No lint baseline is checked in. Lint errors fail the lint task.
    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

dependencies {
    implementation project(':core')

    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
}

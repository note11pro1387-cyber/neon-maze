    <g transform="translate(802 145)"><rect width="158" height="148" rx="20" fill="#030A16" opacity=".6"/><rect x="0.5" y="0.5" width="157" height="147" rx="19.5" fill="url(#card)" stroke="url(#edge)"/><path d="M18 1.2H140" stroke="#D3F8FF" stroke-opacity=".14"/><use xlink:href="#i-settings" x="59" y="31" width="40" height="40"/><text x="79" y="112" class="label" text-anchor="middle">SETTINGS</text><text x="79" y="130" class="sub" text-anchor="middle">PREFERENCES</text></g>
    <g transform="translate(988 145)"><rect width="158" height="148" rx="20" fill="#030A16" opacity=".6"/><rect x="0.5" y="0.5" width="157" height="147" rx="19.5" fill="url(#card)" stroke="url(#edge)"/><path d="M18 1.2H140" stroke="#D3F8FF" stroke-opacity=".14"/><use xlink:href="#i-pause" x="59" y="31" width="40" height="40"/><text x="79" y="112" class="label" text-anchor="middle">PAUSE</text><text x="79" y="130" class="sub" text-anchor="middle">GAME STATE</text></g>
    <!-- row 2 -->
    <g transform="translate(58 323)"><rect width="158" height="148" rx="20" fill="#030A16" opacity=".6"/><rect x="0.5" y="0.5" width="157" height="147" rx="19.5" fill="url(#card)" stroke="url(#edge)"/><path d="M18 1.2H140" stroke="#D3F8FF" stroke-opacity=".14"/><use xlink:href="#i-restart" x="59" y="31" width="40" height="40"/><text x="79" y="112" class="label" text-anchor="middle">RESTART</text><text x="79" y="130" class="sub" text-anchor="middle">RETRY</text></g>

    <g transform="translate(616 501)"><rect width="158" height="148" rx="20" fill="#030A16" opacity=".6"/><rect x="0.5" y="0.5" width="157" height="147" rx="19.5" fill="url(#card)" stroke="url(#edge)"/><path d="M18 1.2H140" stroke="#D3F8FF" stroke-opacity=".14"/><use xlink:href="#i-success" x="59" y="31" width="40" height="40"/><text x="79" y="112" class="label" text-anchor="middle">SUCCESS</text><text x="79" y="130" class="sub" text-anchor="middle">COMPLETION</text></g>

    <g transform="translate(616 323)"><rect width="158" height="148" rx="20" fill="#030A16" opacity=".6"/><rect x="0.5" y="0.5" width="157" height="147" rx="19.5" fill="url(#card)" stroke="url(#edge)"/><path d="M18 1.2H140" stroke="#D3F8FF" stroke-opacity=".14"/><use xlink:href="#i-clock" x="59" y="31" width="40" height="40"/><text x="79" y="112" class="label" text-anchor="middle">TIME</text><text x="79" y="130" class="sub" text-anchor="middle">RECORD</text></g>
    <g transform="translate(802 323)"><rect width="158" height="148" rx="20" fill="#030A16" opacity=".6"/><rect x="0.5" y="0.5" width="157" height="147" rx="19.5" fill="url(#card)" stroke="url(#edge)"/><path d="M18 1.2H140" stroke="#D3F8FF" stroke-opacity=".14"/><use xlink:href="#i-star" x="59" y="31" width="40" height="40"/><text x="79" y="112" class="label" text-anchor="middle">STARS</text><text x="79" y="130" class="sub" text-anchor="middle">ACHIEVEMENT</text></g>

# -----------------------------------------------------------------------------
# NEON MAZE — Gradle configuration
# -----------------------------------------------------------------------------
# Toolchain: AGP 9.4.0 / Gradle 9.6.0 / JDK 17
# AGP 9.4.0 requires Gradle 9.6.0 and JDK 17; do not lower these versions
# without a Change Request and a full re-verification pass.
# -----------------------------------------------------------------------------

# JVM memory and file encoding for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is the only supported UI/runtime library set in this project.
# Default is true on AGP 9.0.0+, declared explicitly to lock the behaviour.
android.useAndroidX=true

# Generate R classes only in the module that declares the resources.
# Reduces classpath pollution and keeps :core free of Android references.
android.nonTransitiveRClass=true
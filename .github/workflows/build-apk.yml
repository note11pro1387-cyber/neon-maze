            sha256sum --check --strict gradle-wrapper.jar.sha256
          )
          ./gradlew --no-daemon --version

      - name: Run Core tests, Android lint and assemble Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :core:test \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify APK and write SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" > "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"

      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: neon-maze-debug-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: neon-maze-build-diagnostics-${{ github.run_number }}
          path: |
            core/build/reports/tests/test/
            core/build/test-results/test/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7
